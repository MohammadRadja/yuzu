name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install brisk
        env:
          BRISK_VERSION: v0.1.6
        run: |
          curl -fsSL https://raw.githubusercontent.com/plyght/brisk/master/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swiftc --version
          brisk --version || true

      - name: Build
        run: |
          bash scripts/prepare-native.sh
          brisk build --verbose

      - name: Test
        run: brisk test --verbose

      - name: OCR integration in owned AppKit host
        env:
          YUZU_GUI_CASE: OCR
        run: bash scripts/check-gui.sh

      - name: Diagnose native OCR failure
        if: failure()
        run: |
          bash scripts/diagnose-ocr.sh 2>&1 | tee ocr-diagnostics.txt
          /usr/bin/log show --last 3m --style compact --predicate 'process == "OCRDiagnostics" OR subsystem CONTAINS[c] "TextRecognition" OR subsystem CONTAINS[c] "Vision"' > ocr-system-log.txt 2>&1 || true

      - name: Upload OCR diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-diagnostics-${{ matrix.runner }}
          path: |
            ocr-diagnostics.txt
            ocr-system-log.txt
          if-no-files-found: warn

      - name: Screenshots
        run: |
          mkdir -p screenshots
          APP="$(brisk path)"
          YUZU_SCREENSHOTS="$PWD/screenshots" perl -e 'alarm 600; exec @ARGV' "$APP/Contents/MacOS/Yuzu" || echo "screenshot driver exited $?"
          sleep 5
          ls -la screenshots
          mkdir -p screenshots/crash
          cp ~/Library/Logs/DiagnosticReports/Yuzu* screenshots/crash/ 2>/dev/null || true
          for f in screenshots/crash/*; do [ -f "$f" ] && { echo "=== $f"; head -c 20000 "$f"; }; done; true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.runner }}
          path: screenshots
          if-no-files-found: warn

      - name: Archive
        run: brisk archive --release

      - name: Package verified release artifacts
        run: bash scripts/package-dmg.sh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Yuzu-release-${{ matrix.runner }}
          path: dist/Yuzu-*
          if-no-files-found: error
